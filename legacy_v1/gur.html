<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gur & Pandit Registry | HIM-GATHA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f5f5f4; color: #1c1917; }
        h1, h2, h3, h4, .serif { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="antialiased">
    <!-- Global Header -->
    <nav class="bg-stone-900 text-stone-100 sticky top-0 z-50 shadow-2xl border-b border-amber-600/30">
        <div class="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between gap-6">
            <a href="index.html" class="flex items-center space-x-3 min-w-max">
                <span class="text-3xl text-amber-500 drop-shadow-[0_0_8px_rgba(217,119,6,0.8)]">🔱</span>
                <div class="hidden sm:flex flex-col">
                    <span class="font-bold text-lg tracking-widest uppercase serif text-amber-50">HIM-<span class="text-amber-500">GATHA</span></span>
                    <span class="text-[9px] tracking-[0.2em] text-stone-400 uppercase">Celestial Governance Archive</span>
                </div>
            </a>
            <div class="flex-1"></div>
            <div class="flex items-center space-x-6">
                <div class="hidden lg:flex space-x-4 text-[10px] font-bold uppercase tracking-widest">
                    <a href="index.html" class="text-stone-400 hover:text-amber-500 transition">Home</a>
                    <a href="gur.html" class="text-amber-500 transition">Gur Registry</a>
                    <a href="family.html" class="text-stone-400 hover:text-amber-500 transition">Lineages</a>
                    <a href="calendar.html" class="text-stone-400 hover:text-amber-500 transition">Calendar</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-16">
        <div class="mb-12 border-l-4 border-amber-600 pl-6">
            <h2 class="text-3xl font-bold text-stone-900 serif">Gur & Pandit Registry</h2>
            <p class="text-stone-500 mt-2">Hereditary officials of the Divine Estates.</p>
        </div>
        <div id="gurGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>
    <script>
        const ICONS = {'Kullu':'🏔️','Mandi':'🛕','Shimla':'❄️','Kangra':'🔥','Chamba':'⛰️','Bilaspur':'💧','Hamirpur':'🙏','Una':'🌸','Sirmaur':'🌊','Solan':'🍄','Lahaul & Spiti':'☸️','Kinnaur':'🏯'};
        let deities = JSON.parse(localStorage.getItem('KULDEV_DB_V3')) || [];
        const grid = document.getElementById('gurGrid');
        grid.innerHTML = deities.filter(d => d.id.includes('01') || d.id.includes('02')).map(d => `
            <div class="bg-white p-6 rounded-2xl border border-stone-200 shadow-sm flex items-center gap-6">
                <div class="text-4xl bg-stone-50 w-16 h-16 flex items-center justify-center rounded-xl">${ICONS[d.district]||'📿'}</div>
                <div>
                    <h4 class="font-bold text-stone-800 text-sm">${d.name}</h4>
                    <p class="text-[10px] text-stone-400 font-bold uppercase mb-2">${d.district}</p>
                    <p class="text-[11px] text-stone-600"><strong>Oracle:</strong> Hereditary Lineage</p>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
